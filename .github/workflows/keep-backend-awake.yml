name: Keep LookOut backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: curl --fail --silent --show-error --retry 4 --retry-delay 5 https://lookout-p8fw.onrender.com/api/health
